[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp-digital-marketing-engagement"
version = "0.1.0"
description = "Singapore Polytechnic digital marketing engagement analytics project."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Goh Kun Ming" },
  { name = "Phyo Yadana Khaing" },
  { name = "Nuha Syafeqah" },
  { name = "Jayden Lee Jia Jun" },
  { name = "Law Yu Hang" },
  { name = "Sia Xing Ying" },
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.10",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "PyYAML>=6.0",
  "ruff>=0.9",
]
notebook = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", ".ipynb_checkpoints"]
